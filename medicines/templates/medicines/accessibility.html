<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Assistive Eyes - Blind Mode</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #1b5e20;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .navbar {
      background: rgba(0,0,0,0.25);
      padding: 14px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .mode-tag {
      background: #4caf50;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .nav-back {
      color: white;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      background: rgba(255,255,255,0.15);
      padding: 7px 16px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .nav-back:hover {
      background: rgba(255,255,255,0.25);
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 56px);
      padding: 20px;
    }

    .big-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: #4caf50;
      border: 6px solid rgba(255,255,255,0.3);
      color: white;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .big-btn .icon {
      font-size: 3rem;
      line-height: 1;
    }

    .big-btn:hover {
      transform: scale(1.05);
      background: #66bb6a;
    }

    .big-btn:active {
      transform: scale(0.97);
    }

    .big-btn.scanning {
      background: #ff9800;
      animation: pulse 1s infinite;
    }

    .big-btn.success {
      background: #43a047;
    }

    .big-btn.error {
      background: #e53935;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
      50%       { box-shadow: 0 8px 48px rgba(255,152,0,0.6); }
    }

    .status-msg {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      min-height: 2.2rem;
    }

    .sub-msg {
      font-size: 1rem;
      text-align: center;
      opacity: 0.75;
      line-height: 1.6;
      margin-bottom: 32px;
      min-height: 3rem;
    }

    .keys {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .key-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .key {
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-bottom: 4px solid rgba(0,0,0,0.25);
      color: white;
      padding: 8px 18px;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      min-width: 60px;
      text-align: center;
    }

    .key-desc {
      font-size: 0.72rem;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .speaking-bar {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      background: rgba(255,255,255,0.15);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .speaking-bar.show {
      display: flex;
    }

    .wave-bars {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .wb {
      width: 4px;
      background: white;
      border-radius: 2px;
      animation: wave 0.8s ease-in-out infinite;
    }

    .wb:nth-child(1) { animation-delay: 0s;    height: 6px; }
    .wb:nth-child(2) { animation-delay: .15s;  height: 12px; }
    .wb:nth-child(3) { animation-delay: .3s;   height: 8px; }
    .wb:nth-child(4) { animation-delay: .45s;  height: 14px; }
    .wb:nth-child(5) { animation-delay: .6s;   height: 6px; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50%       { transform: scaleY(1); }
    }

    .result-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      color: #333;
      border-radius: 20px 20px 0 0;
      padding: 24px 28px 32px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 65vh;
      overflow-y: auto;
      box-shadow: 0 -4px 30px rgba(0,0,0,0.3);
    }

    .result-sheet.open {
      transform: translateY(0);
    }

    .result-sheet::-webkit-scrollbar {
      width: 4px;
    }

    .result-sheet::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 2px;
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .sheet-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2e7d32;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .sheet-generic {
      font-size: 0.85rem;
      color: #777;
    }

    .close-btn {
      background: #f5f5f5;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .close-btn:hover {
      background: #eee;
    }

    .sheet-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #a5d6a7;
      margin-bottom: 18px;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sheet-item {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 14px;
      border: 1px solid #eee;
    }

    .sheet-item.full {
      grid-column: 1 / -1;
    }

    .item-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 6px;
    }

    .item-value {
      font-size: 0.9rem;
      color: #333;
      line-height: 1.6;
    }

    .warn-sheet {
      background: #fff3e0;
      border: 1px solid #ffcc80;
      border-left: 4px solid #ff9800;
      border-radius: 8px;
      padding: 12px 14px;
      display: none;
    }

    .warn-sheet.show {
      display: block;
    }

    .warn-title-s {
      font-size: 0.75rem;
      font-weight: 700;
      color: #e65100;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .warn-text-s {
      font-size: 0.88rem;
      color: #bf360c;
      line-height: 1.6;
    }

    video, canvas {
      display: none;
    }

  </style>

</head>

<body>

  <nav class="navbar">
    <div class="nav-logo">👁 Assistive Eyes</div>
    <div class="mode-tag">♿ Blind Mode</div>
    <a class="nav-back" href="/">← Visual Mode</a>
  </nav>

  <video id="videoFeed" autoplay playsinline></video>

  <canvas id="canvas"></canvas>

  <div class="center">

    <button class="big-btn" id="bigBtn" onclick="doScan()">
      <span class="icon">🎙</span>
      <span>TAP TO SCAN</span>
    </button>

    <div class="status-msg" id="statusMsg">Ready to Scan</div>

    <div class="sub-msg" id="subMsg">
      Hold medicine label in front of camera<br>then press Spacebar or tap button
    </div>

    <div class="keys">
      <div class="key-hint"><div class="key">Space</div><div class="key-desc">Scan</div></div>
      <div class="key-hint"><div class="key">R</div><div class="key-desc">Repeat</div></div>
      <div class="key-hint"><div class="key">Esc</div><div class="key-desc">Dismiss</div></div>
    </div>

    <div class="speaking-bar" id="speakBar">
      <div class="wave-bars">
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
        <div class="wb"></div>
      </div>
      Speaking...
    </div>

  </div>

  <div class="result-sheet" id="resultSheet">

    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <div>
        <div class="sheet-name" id="sheetName">—</div>
        <div class="sheet-generic" id="sheetGeneric">—</div>
      </div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>

    <span class="sheet-badge" id="sheetCat">—</span>

    <div class="sheet-grid">
      <div class="sheet-item full"><div class="item-label">Used For</div><div class="item-value" id="sheetUses">—</div></div>
      <div class="sheet-item"><div class="item-label">Dosage</div><div class="item-value" id="sheetDosage">—</div></div>
      <div class="sheet-item"><div class="item-label">Side Effects</div><div class="item-value" id="sheetSide">—</div></div>
    </div>

    <div class="warn-sheet" id="warnSheet">
      <div class="warn-title-s">⚠ Warning</div>
      <div class="warn-text-s" id="warnSheetText">—</div>
    </div>

  </div>

  <script>

    const video  = document.getElementById('videoFeed');
    const canvas = document.getElementById('canvas');
    const bigBtn = document.getElementById('bigBtn');
    const statusMsg = document.getElementById('statusMsg');
    const subMsg    = document.getElementById('subMsg');

    let scanning   = false;
    let lastScript = '';

    function speak(text, cb = null) {

      window.speechSynthesis.cancel();

      const u = new SpeechSynthesisUtterance(text);

      u.rate   = 0.92;
      u.pitch  = 1;
      u.volume = 1;

      document.getElementById('speakBar').classList.add('show');

      u.onend = () => {
        document.getElementById('speakBar').classList.remove('show');
        if (cb) cb();
      };

      window.speechSynthesis.speak(u);

    }

    function setBtnState(state) {

      bigBtn.className = 'big-btn';

      if (state === 'scanning') {
        bigBtn.classList.add('scanning');
        bigBtn.querySelector('span:last-child').textContent = 'SCANNING...';
        bigBtn.querySelector('.icon').textContent = '⏳';
      } else if (state === 'success') {
        bigBtn.classList.add('success');
        bigBtn.querySelector('span:last-child').textContent = 'FOUND!';
        bigBtn.querySelector('.icon').textContent = '✅';
      } else if (state === 'error') {
        bigBtn.classList.add('error');
        bigBtn.querySelector('span:last-child').textContent = 'NOT FOUND';
        bigBtn.querySelector('.icon').textContent = '❌';
      } else {
        bigBtn.querySelector('span:last-child').textContent = 'TAP TO SCAN';
        bigBtn.querySelector('.icon').textContent = '🎙';
      }

    }

    async function startCamera() {

      try {

        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });

        video.srcObject = s;

        speak('Assistive Eyes is ready. Press spacebar or tap the button to scan a medicine label.');

      } catch(e) {

        setBtnState('error');
        statusMsg.textContent = 'Camera Error';
        speak('Camera error. Please check camera permissions.');

      }

    }

    async function doScan() {

      if (scanning) return;

      scanning = true;

      setBtnState('scanning');

      statusMsg.textContent = 'Scanning...';
      subMsg.textContent    = 'Hold the medicine label still';

      speak('Scanning. Please hold still.');

      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      const img = canvas.toDataURL('image/jpeg', 0.85);

      try {

        const res  = await fetch('/api/scan/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: img })
        });

        const data = await res.json();

        if (data.success) {

          const m = data.medicine;

          setBtnState('success');

          statusMsg.textContent = m.name;
          subMsg.textContent    = m.category + (m.generic_name ? ' · ' + m.generic_name : '');

          document.getElementById('sheetName').textContent    = m.name;
          document.getElementById('sheetGeneric').textContent = m.generic_name ? 'Also known as: ' + m.generic_name : '';
          document.getElementById('sheetCat').textContent     = m.category;
          document.getElementById('sheetUses').textContent    = m.uses;
          document.getElementById('sheetDosage').textContent  = m.dosage;
          document.getElementById('sheetSide').textContent    = m.side_effects;

          const ws = document.getElementById('warnSheet');

          if (m.warnings) {
            document.getElementById('warnSheetText').textContent = m.warnings;
            ws.classList.add('show');
          } else {
            ws.classList.remove('show');
          }

          document.getElementById('resultSheet').classList.add('open');

          lastScript = `Medicine detected: ${m.name}. ${m.generic_name ? 'Also known as ' + m.generic_name + '.' : ''} Category: ${m.category}. Used for: ${m.uses}. Dosage: ${m.dosage}. Side effects: ${m.side_effects}. ${m.warnings ? 'Warning: ' + m.warnings : ''} Press spacebar to scan again.`;

          speak(lastScript, () => { scanning = false; });

        } else {

          setBtnState('error');

          statusMsg.textContent = 'Not Found';
          subMsg.textContent    = data.message;

          speak(data.message + '. Press spacebar to try again.', () => {
            scanning = false;
            setBtnState('ready');
            statusMsg.textContent = 'Ready to Scan';
            subMsg.textContent    = 'Press Spacebar to scan again';
          });

        }

      } catch(e) {

        setBtnState('error');
        statusMsg.textContent = 'Network Error';
        speak('Network error.', () => { scanning = false; setBtnState('ready'); });

      }

    }

    function closeSheet() {

      document.getElementById('resultSheet').classList.remove('open');

      setBtnState('ready');

      statusMsg.textContent = 'Ready to Scan';
      subMsg.textContent    = 'Press Spacebar to scan a medicine label';

      scanning = false;

    }

    // Keyboard shortcuts: Space = scan, R = repeat audio, Esc = close sheet
    document.addEventListener('keydown', e => {

      if (e.code === 'Space') { e.preventDefault(); doScan(); }

      if (e.code === 'KeyR' && lastScript) speak(lastScript);

      if (e.code === 'Escape') closeSheet();

    });

    startCamera();

  </script>

</body>

</html>

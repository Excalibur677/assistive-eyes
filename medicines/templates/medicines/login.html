<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Assistive Eyes - Admin Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f1f8e9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: up 0.35s ease;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .box-header {
      background: #2e7d32;
      padding: 28px 28px 24px;
      text-align: center;
      color: white;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 14px;
      border: 3px solid rgba(255,255,255,0.35);
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-sub {
      font-size: 0.82rem;
      opacity: 0.8;
    }

    .box-body {
      padding: 28px;
    }

    .err-box {
      background: #fce4ec;
      border: 1px solid #f48fb1;
      border-left: 4px solid #e91e63;
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 18px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #c62828;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .err-box.show {
      display: flex;
    }

    .fg {
      margin-bottom: 16px;
    }

    .fl {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .fi {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      color: #333;
      outline: none;
      transition: all 0.2s;
    }

    .fi:focus {
      border-color: #4caf50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.12);
    }

    .fi::placeholder {
      color: #bbb;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .login-btn:hover {
      background: #1b5e20;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(46,125,50,0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .box-footer {
      padding: 16px 28px 22px;
      text-align: center;
      border-top: 1px solid #f5f5f5;
    }

    .back-link {
      color: #777;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      color: #2e7d32;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #f0f0f0;
    }

    .divider span {
      font-size: 0.75rem;
      color: #bbb;
      white-space: nowrap;
    }

  </style>

</head>

<body>

  <div class="box">

    <div class="box-header">
      <div class="header-icon">👁</div>
      <div class="header-title">Assistive Eyes</div>
      <div class="header-sub">Admin Login — Authorised Access Only</div>
    </div>

    <div class="box-body">

      <div class="err-box" id="errBox">
        <span>⚠️</span>
        <span id="errText">Invalid username or password</span>
      </div>

      <div class="fg">
        <label class="fl">Username</label>
        <input class="fi" type="text" id="user" placeholder="Enter your username" autofocus>
      </div>

      <div class="fg">
        <label class="fl">Password</label>
        <!-- Press Enter to submit -->
        <input class="fi" type="password" id="pass" placeholder="Enter your password" onkeydown="if(event.key==='Enter') doLogin()">
      </div>

      <button class="login-btn" onclick="doLogin()">🔐 &nbsp; Login to Dashboard</button>

    </div>

    <div class="box-footer">
      <div class="divider"><span>or</span></div>
      <a class="back-link" href="/">← Go back to Scanner</a>
    </div>

  </div>

  <script>

    async function doLogin() {

      const user    = document.getElementById('user').value.trim();
      const pass    = document.getElementById('pass').value;
      const errBox  = document.getElementById('errBox');
      const errText = document.getElementById('errText');

      if (!user || !pass) {
        errText.textContent = 'Please enter both username and password';
        errBox.classList.add('show');
        return;
      }

      errBox.classList.remove('show');

      try {

        const html  = await fetch('/admin/login/?next=/dashboard/').then(r => r.text());
        const match = html.match(/csrfmiddlewaretoken.*?value="([^"]+)"/);
        const csrf  = match ? match[1] : '';

        const form = new FormData();

        form.append('username', user);
        form.append('password', pass);
        form.append('csrfmiddlewaretoken', csrf);
        form.append('next', '/dashboard/');

        const res = await fetch('/admin/login/?next=/dashboard/', {
          method: 'POST',
          body: form,
          redirect: 'follow',
          credentials: 'include'
        });

        if (res.url.includes('dashboard') || res.redirected) {
          window.location.href = '/dashboard/';
        } else {
          errText.textContent = 'Wrong username or password. Please try again.';
          errBox.classList.add('show');
          document.getElementById('pass').value = '';
        }

      } catch(e) {

        errText.textContent = 'Connection error — is the server running?';
        errBox.classList.add('show');

      }

    }

  </script>

</body>

</html>
